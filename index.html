<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heater</title>
<style>
  :root { --ink:#15181C; --muted:#646B73; --red:#D21310; --line:#E4E7EB; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 20px; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); background:#fff; }
  main { max-width:680px; margin:0 auto; }
  h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:-.02em; }
  .lede { color:var(--muted); margin:0 0 2rem; }
  .note { border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:0 0 2rem;
          background:#FDECEC; border-color:#F3CFCF; }
  .note strong { color:var(--red); }
  ul { list-style:none; padding:0; margin:0; }
  li { border-bottom:1px solid var(--line); }
  li:first-child { border-top:1px solid var(--line); }
  a { display:flex; justify-content:space-between; align-items:center;
      padding:16px 4px; color:var(--ink); text-decoration:none; font-weight:600; }
  a:hover { color:var(--red); }
  a::after { content:"›"; color:#99A0A7; font-size:1.3rem; }
  footer { margin-top:3rem; color:#99A0A7; font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Heater</h1>
  <p class="lede">A social sports-prediction game. Friends compete in minigames using real sports data.</p>

  <div class="note">
    <strong>There is no real-money wagering in Heater.</strong>
    No deposits, no withdrawals, no cash prizes. Scores are points only.
  </div>

  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
    <li><a href="terms/">Terms of Service</a></li>
    <li><a href="support/">Support</a></li>
  </ul>

  <footer>Heater — Ethan Diggins</footer>
</main>
</body>
</html>
